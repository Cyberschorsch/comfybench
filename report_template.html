// Generate: selection, plan, start/stop, progress
// =====================================================================
const RN = { status: null, plan: null, planErr: "", timer: null, planTimer: null, lastDone: -1, lastReload: 0, swq: {} };
const rnPrompts = () => D.prompts.filter(p => p.id !== "_import");
const rnBaseVariants = p => p.variants.filter(v => !v.extra).length || 1;
// LoRAs of the currently selected models: union in config order, with the
// models that do not define a LoRA recorded for the "skipped for …" hint.
function rnLoraUnion(){
  const sel = rnLoraModels(), out = [];
  sel.forEach(m => Object.entries(m.loras || {}).forEach(([name, info]) => {
    let e = out.find(x => x.name === name);
    if(!e){ e = {name, info: info || {}}; out.push(e); }
  }));
  out.forEach(e => e.missing = sel.filter(m => !(m.loras || {})[e.name]).map(m => m.label));
  return out;
}
const rnLoraModels = () => D.models.filter(m => S.rnModels.includes(m.id));
function rnLoraSweepCount(m, mode){
  const n = Object.keys(m.loras || {}).length;
  if(!n) return 1;
  if(mode === "singles") return n;
  if(mode === "pairs") return n * (n - 1) / 2;
  return Math.pow(2, n) - 1;
}
function rnInitSelection(){
  if(!Array.isArray(S.rnModels)) S.rnModels = D.models.filter(m => m.enabled !== false).map(m => m.id);
  if(!Array.isArray(S.rnPrompts)) S.rnPrompts = rnPrompts().map(p => p.id);
  if(!Array.isArray(S.rnSweeps)) S.rnSweeps = [];
  if(!["base", "combo", "sweep"].includes(S.rnLoraMode)) S.rnLoraMode = "base";
  if(!Array.isArray(S.rnLoraSel)) S.rnLoraSel = [];
  if(!S.rnLoraStr || typeof S.rnLoraStr !== "object") S.rnLoraStr = {};
  if(!["singles", "pairs", "all"].includes(S.rnLoraSweep)) S.rnLoraSweep = "all";
  // Remove orphaned entries (deleted models/prompts)
  S.rnModels = S.rnModels.filter(id => D.models.some(m => m.id === id));
  S.rnPrompts = S.rnPrompts.filter(id => D.prompts.some(p => p.id === id));
}
const rnActive = () => RN.status && ["running", "stopping"].includes(RN.status.state);
function fmtDur(s){ s = Math.max(0, Math.round(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return h ? `${h} h ${m} min` : m ? `${m} min ${String(x).padStart(2,"0")} s` : `${x} s`; }

// Image input handling
async function rnGetMappedImageKeys(){
  // Fetch mapped image keys from first selected model's img2img workflow
  if(!S.rnModels.length) return [];
  const mid = S.rnModels[0];
  const m = D.models.find(m => m.id === mid);
  if(!m || !m.modes.includes("img2img")) return [];
  
  // Get workflow file for img2img
  let wfFile = null;
  if(m.workflows && m.workflows.img2img){
    wfFile = typeof m.workflows.img2img === "string" ? m.workflows.img2img : m.workflows.img2img.file;
  }
  if(!wfFile) return [];
  
  try {
    const analysis = await api("POST", "api/workflow/analyze", {file: wfFile});
    return Object.keys(analysis.suggest || {}).filter(k => IMAGE_KEY.test(k));
  } catch(e){
    return [];
  }
}

async function rnGetImageFields(promptId){
  const p = promptMap.get(promptId);
  if(!p) return [];
  const mappedKeys = await rnGetMappedImageKeys();
  const fields = [];
  for(const [k,v] of Object.entries(p)){
    if(IMAGE_KEY.test(k) && typeof v === "string" && mappedKeys.includes(k)){
      fields.push({key: k, value: v, label: k === "image" ? "Main image" : `Image ${k.slice(5) || "2"}`});
    }
  }
  return fields;
}

async function rnRenderImageInputs(){
  const selected = S.rnPrompts.filter(id => promptMap.has(id));
  const allFields = [];
  for(const pid of selected){
    const fields = await rnGetImageFields(pid);
    fields.forEach(f => allFields.push({prompt: pid, ...f}));
  }
  if(!allFields.length) return "";
  
  const genOptions = D.generations
    .filter(g => g.status === "ok" && g.files && g.files.length)
    .sort((a,b) => b._i - a._i)
    .slice(0, 50)
    .map(g => `<option value="gen:${esc(g.id)}">${esc(g.id.slice(0,8))} · ${esc(mLabel(g.model))} · ${esc(g.prompt).slice(0,30)}</option>`).join("");
  
  const inputOptions = (SU.data?.files?.inputs || []).map(f => `<option value="${esc(f)}">${esc(f)}</option>`).join("");
  
  return allFields.map((f, i) => `
    <div class="rn-sec" style="border-left:3px solid var(--accent);padding-left:12px;margin-left:-3px" data-rn-img-wrap="${esc(f.prompt)}" data-rn-img-wrap-key="${esc(f.key)}">
      <div class="rn-h">${esc(f.label)} for <b>${esc(f.prompt)}</b></div>
      <div class="row" style="gap:8px;flex-wrap:wrap;align-items:center">
        <select data-rn-img="${esc(f.prompt)}" data-rn-img-key="${esc(f.key)}" style="flex:1;min-width:200px">
          <option value="">– select –</option>
          <option value="__upload">📤 Upload …</option>
          ${inputOptions ? `<optgroup label="From inputs/">${inputOptions}</optgroup>` : ""}
          ${genOptions ? `<optgroup label="Previous generations">${genOptions}</optgroup>` : ""}
        </select>
        <span class="hint" style="flex:1 1 100%;font-size:11px">${esc(f.value || "no default")}</span>
      </div>
      <div class="rn-img-preview" style="margin-top:8px;min-height:64px"></div>
    </div>
  `).join("");
}

function rnBindImageInputs(){
  document.querySelectorAll("[data-rn-img]").forEach(sel => {
    const prompt = sel.dataset.rnImg, key = sel.dataset.rnImgKey;
    const stored = S.rnImages?.[prompt]?.[key];
    if(stored) sel.value = stored;
    sel.onchange = () => {
      if(sel.value === "__upload"){ rnUploadImage(prompt, key, sel); return; }
      S.rnImages = S.rnImages || {}; S.rnImages[prompt] = S.rnImages[prompt] || {};
      S.rnImages[prompt][key] = sel.value || undefined;
      if(!S.rnImages[prompt][key]) delete S.rnImages[prompt][key];
      if(Object.keys(S.rnImages[prompt]).length === 0) delete S.rnImages[prompt];
      save(); rnPlanSoon(); rnUpdateImagePreview(prompt, key);
    };
    rnUpdateImagePreview(prompt, key);
  });
}

function rnUpdateImagePreview(prompt, key){
  const wrap = document.querySelector(`[data-rn-img-wrap="${esc(prompt)}"][data-rn-img-wrap-key="${esc(key)}"]`);
  if(!wrap) return;
  const preview = wrap.querySelector(".rn-img-preview");
  const sel = wrap.querySelector(`[data-rn-img="${esc(prompt)}"][data-rn-img-key="${esc(key)}"]`);
  if(!preview || !sel) return;
  
  const val = sel.value;
  if(!val){
    preview.innerHTML = "";
    return;
  }
  
  let url = "";
  if(val.startsWith("gen:")){
    const gid = val.slice(4);
    const gen = D.generations.find(g => g.id === gid);
    if(gen?.files?.[0]) url = fileUrl(gen.files[0]);
  } else {
    url = "inputs/" + val;
  }
  
  if(url){
    preview.innerHTML = `<img src="${url}" alt="Preview" style="max-width:200px;max-height:200px;border-radius:6px;border:1px solid var(--line);background:var(--bg)">
      <div class="hint" style="margin-top:4px;font-size:11px">${esc(val)}</div>`;
  } else {
    preview.innerHTML = `<span class="hint">No preview available</span>`;
  }
}

async function rnUploadImage(prompt, key, sel){
  const f = await pickFile("image/png,image/jpeg,image/webp");
  if(!f){ sel.value = ""; return; }
  const dataUrl = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); });
  try {
    const r = await api("POST", "api/upload", {kind: "input", name: f.name, data: dataUrl});
    SU.data.files.inputs = [...new Set([...SU.data.files.inputs, r.path])].sort();
    S.rnImages = S.rnImages || {}; S.rnImages[prompt] = S.rnImages[prompt] || {};
    S.rnImages[prompt][key] = r.path;
    save(); rnRender();
  } catch(e){ toast(e.message); sel.value = ""; }
}

// Sweeps over choice fields: union of the ComfyUI options of the selected models
function rnSweepOptions(name){
  const out = []; name = (name || "").trim(); if(!name) return out;
  rnLoraModels().forEach(m => (comfyOpts(m.id, name) || []).forEach(o => {
    let e = out.find(x => x.o === o); if(!e) out.push(e = {o, models: []}); e.models.push(m.label); }));
  return out;
}
const splitVals = s => String(s || "").split(",").map(x => x.trim()).filter(Boolean);
function rnSweepPicker(sw, i, opts){
  const sel = new Set(splitVals(sw.vals)), q = (RN.swq[i] || "").trim().toLowerCase();
  const nModels = rnLoraModels().filter(m => comfyOpts(m.id, sw.name.trim())).length;
  const items = opts.filter(e => !q || e.o.toLowerCase().includes(q)).map(e => {
    const comma = e.o.includes(",");
    return `<label class="rn-item" ${comma ? 'title="Contains a comma – cannot be swept"' : ""}><input type="checkbox" data-rn-swopt="${i}" data-o="${esc(e.o)}" ${sel.has(e.o)?"checked":""} ${comma?"disabled":""}>
      <span>${esc(e.o)}${e.models.length < nModels ? `<small>${e.models.map(esc).join(", ")}</small>` : ""}</span></label>`; }).join("");
  return `<div style="flex:1;min-width:220px"><div class="row"><input type="search" placeholder="Search …" data-rn-swq="${i}" value="${esc(RN.swq[i] || "")}" style="flex:1">
      <button data-rn-act="sw-all" data-i="${i}">all</button><button data-rn-act="sw-none" data-i="${i}">none</button><span class="hint">${sel.size} selected</span></div>
    <div class="rn-sw-list">${items || `<span class="hint">No matching options.</span>`}</div></div>`;
}
function rnBody(){
  const sweep = {}, byModel = {};
  S.rnSweeps.forEach(sw => { if(sw.name && sw.vals) sweep[sw.name.trim()] = sw.vals; });
  // per model only the values its ComfyUI node accepts (empty → model is skipped for this sweep)
  Object.entries(sweep).forEach(([name, vals]) => S.rnModels.forEach(mid => {
    const o = comfyOpts(mid, name); if(!o) return;
    (byModel[mid] = byModel[mid] || {})[name] = splitVals(vals).filter(v => o.includes(v)).join(",");
  }));
  const body = {models: S.rnModels, prompts: S.rnPrompts, sweep, force: !!S.rnForce, dry_run: !!S.rnDry, images: S.rnImages || {}};
  if(Object.keys(byModel).length) body.sweep_by_model = byModel;
  if(S.rnLoraMode === "combo"){
    const names = rnLoraUnion().map(x => x.name).filter(n => S.rnLoraSel.includes(n));
    if(names.length){
      const parts = names.map(n => {
        const st = String(S.rnLoraStr[n] ?? "").trim();
        if(st && !Number.isFinite(Number(st))) throw new Error(`LoRA strength for "${n}" must be a number (e.g. 0.8)`);
        return st ? `${n}:${st}` : n;
      });
      body.lora_combo = [parts.join(",")];
    }
  }
  else if(S.rnLoraMode === "sweep") body.sweep_loras = S.rnLoraSweep || "all";
  return body;
}

async function rnRender(){
  rnInitSelection();
  const selM = new Set(S.rnModels), selP = new Set(S.rnPrompts);
  const models = D.models.map(m => `<label class="rn-item"><input type="checkbox" data-rn-model="${esc(m.id)}" ${selM.has(m.id)?"checked":""}>
      <span>${esc(m.label)}<small>${esc(m.modes.join(", ") || "no workflow")}${m.enabled===false?" · inactive":""}</small></span></label>`).join("");
  const cats = {};
  rnPrompts().forEach(p => (cats[p.category || "uncategorized"] = cats[p.category || "uncategorized"] || []).push(p));
  const prompts = Object.entries(cats).map(([c, ps]) => {
    const n = ps.filter(p => selP.has(p.id)).length;
    return `<div class="rn-cat"><label class="rn-item rn-cathead"><input type="checkbox" data-rn-cat="${esc(c)}" ${n===ps.length?"checked":""} ${n>0&&n<ps.length?'data-indet="1"':""}>
      <b>${esc(c)}</b> <small>${n}/${ps.length}</small></label>
      ${ps.map(p => { const v = rnBaseVariants(p);
        return `<label class="rn-item rn-p"><input type="checkbox" data-rn-prompt="${esc(p.id)}" ${selP.has(p.id)?"checked":""}><span>${esc(p.id)}${v>1?` <small>×${v} variants</small>`:""}${p.mode!=="txt2img"?` <span class="tag">${esc(p.mode)}</span>`:""}</span></label>`; }).join("")}</div>`;
  }).join("");
  
  // Image inputs for selected img2img prompts
  const imgInputs = await rnRenderImageInputs();
  
  if(!CO.data && !CO.loading) loadComfyOptions().then(() => { if(S.view === "run") keepFocus(rnRender); });
  const keys = [...new Set(D.models.filter(m => selM.has(m.id)).flatMap(m => m.keys || []))].sort();
  const sweeps = S.rnSweeps.map((sw, i) => {
    const lacking = sw.name ? D.models.filter(m => selM.has(m.id) && !(m.keys || []).includes(sw.name)).map(m => m.label) : [];
    const opts = rnSweepOptions(sw.name);
    const vals = opts.length ? rnSweepPicker(sw, i, opts)
      : `<input type="text" placeholder="e.g. 3, 5, 7" data-rn-sw="${i}" data-f="vals" value="${esc(sw.vals)}" style="flex:1;min-width:140px">`;
    return `<div class="row rn-sweep"><input type="text" list="rn-keys" placeholder="Value, e.g. cfg" data-rn-sw="${i}" data-f="name" value="${esc(sw.name)}" style="width:150px">
      ${vals}
      <button class="x" data-rn-act="del-sweep" data-i="${i}">✕</button>
      ${lacking.length ? `<div class="hint" style="width:100%">skipped for: ${lacking.map(esc).join(", ")}</div>` : ""}</div>`;
  }).join("");

  // LoRAs (only when at least one selected model defines some)
  const loraUnion = rnLoraUnion();
  const loraSel = new Set(S.rnLoraSel);
  let loraSection = "";
  if(loraUnion.length){
    const modes = [["base", "Base (no LoRA)"], ["combo", "One combination"], ["sweep", "Sweep"]];
    const radios = modes.map(([v, l]) => `<label class="rn-item"><input type="radio" name="rn-lora-mode" data-rn-lora-mode="${v}" ${S.rnLoraMode===v?"checked":""}> <span>${l}</span></label>`).join("");
    let body = "";
    if(S.rnLoraMode === "combo"){
      body = loraUnion.map(x => {
        const on = loraSel.has(x.name), dflt = x.info.default_strength;
        return `<div class="row rn-lora">
          <label class="rn-item" style="flex:1;min-width:170px"><input type="checkbox" data-rn-lora="${esc(x.name)}" ${on?"checked":""}>
            <span>${esc(x.name)}<small>${x.info.trigger?`trigger: “${esc(x.info.trigger)}”`:"no trigger word"}${dflt!=null?` · default ${esc(dflt)}`:""}</small></span></label>
          <input type="text" inputmode="decimal" data-rn-lora-str="${esc(x.name)}" value="${esc(S.rnLoraStr[x.name] ?? "")}" placeholder="strength${dflt!=null?` (${esc(dflt)})`:""}" ${on?"":"disabled"} style="width:140px">
          ${x.missing.length ? `<div class="hint">skipped for: ${x.missing.map(esc).join(", ")}</div>` : ""}</div>`;
      }).join("");
      const n = loraUnion.filter(x => loraSel.has(x.name)).length;
      body += n ? "" : `<div class="hint">Nothing checked – runs without LoRA.</div>`;
    }
    else if(S.rnLoraMode === "sweep"){
      const opts = [["singles", "every LoRA alone"], ["pairs", "every pair"], ["all", "every combination"]]
        .map(([v, l]) => `<option value="${v}" ${S.rnLoraSweep===v?"selected":""}>${l}</option>`).join("");
      const counts = rnLoraModels().map(m => {
        const n = Object.keys(m.loras || {}).length;
        return n ? `${m.label}: ${rnLoraSweepCount(m, S.rnLoraSweep)} combination${rnLoraSweepCount(m, S.rnLoraSweep)===1?"":"s"}`
                 : `${m.label}: base only (no LoRAs)`;
      }).join(" · ");
      body = `<div class="row rn-lora"><label class="rn-item"><span>Combine</span></label>
          <select data-rn-lora-sweep>${opts}</select></div>
        <div class="hint">${esc(counts)}</div>`;
    }
    loraSection = `<div class="rn-sec"><div class="rn-h">LoRAs <span class="hint">injected into the workflow · optional</span></div>
      <div class="rn-lora-modes">${radios}</div>${body}</div>`;
  }
  $("#run").innerHTML = `<div class="rn">
    <div class="rn-card"><h2>What should be generated?</h2>
      <div class="rn-sec"><div class="rn-h">Models <span><button data-rn-act="m-all">all</button><button data-rn-act="m-none">none</button></span></div>${models || `<p class="hint">No models yet – create them under Setup.</p>`}</div>
      <div class="rn-sec"><div class="rn-h">Prompts <span><button data-rn-act="p-all">all</button><button data-rn-act="p-none">none</button></span></div><div class="rn-plist">${prompts}</div></div>
      ${imgInputs}
      <div class="rn-sec"><div class="rn-h">Sweeps <span class="hint">extra axis for all selected prompts</span></div>
        ${sweeps}<datalist id="rn-keys">${keys.map(k => `<option>${esc(k)}</option>`).join("")}</datalist>
        <button data-rn-act="add-sweep">＋ Sweep</button></div>
      ${loraSection}
      <div class="rn-sec"><label class="rn-item"><input type="checkbox" data-rn-opt="force" ${S.rnForce?"checked":""}> <span>Regenerate existing images anyway<small>creates additional versions</small></span></label>
        <label class="rn-item"><input type="checkbox" data-rn-opt="dry" ${S.rnDry?"checked":""}> <span>Dry run without ComfyUI<small>only fills the workflows (results/_dryrun)</small></span></label></div>
      <div class="rn-plan" id="rn-plan"></div>
      <button class="btn-p rn-start" data-rn-act="start" id="rn-start">Start generating</button>
    </div>
    <div class="rn-card" id="rn-status"></div></div>`;
  document.querySelectorAll("[data-indet]").forEach(el => el.indeterminate = true);
  rnPlanRender(); rnStatusRender(); rnPlanSoon();
  rnBindImageInputs();
}
function rnPlanSoon(){
  clearTimeout(RN.planTimer);
  RN.planTimer = setTimeout(async () => {
    if(!S.rnModels.length || !S.rnPrompts.length){ RN.plan = null; RN.planErr = ""; return rnPlanRender(); }
    try { RN.plan = await api("POST", "api/run/plan", rnBody()); RN.planErr = ""; }
    catch(e){ RN.plan = null; RN.planErr = e.message; }
    rnPlanRender();
  }, 250);
}
function rnPlanRender(){
  const el = $("#rn-plan"), btn = $("#rn-start"); if(!el) return;
  const pl = RN.plan;
  let html, can = false;
  if(!S.rnModels.length || !S.rnPrompts.length) html = `<span class="hint">Select at least one model and one prompt.</span>`;
  else if(RN.planErr) html = `<div class="warnline">${esc(RN.planErr)}</div>`;
  else if(!pl) html = `<span class="hint">Calculating …</span>`;
  else {
    can = pl.new > 0;
    const avg = (() => { const xs = D.generations.filter(g => g.status === "ok" && g.seconds && S.rnModels.includes(g.model)).map(g => g.seconds);
      return xs.length ? xs.reduce((a,b)=>a+b,0)/xs.length : null; })();
    html = `<b>${pl.new} new image${pl.new===1?"":"s"}</b> · ${pl.total} jobs total${pl.existing ? `, ${pl.existing} already exist` : ""}${pl.idle ? `, ${pl.idle} skipped because of sweep` : ""}
      ${avg && pl.new && !S.rnDry ? `<div class="hint">estimated about ${fmtDur(avg * pl.new)} (Ø ${avg.toFixed(1)} s per image so far)</div>` : ""}
      ${pl.warnings.map(w => `<div class="hint">⚠ ${esc(w)}</div>`).join("")}
      ${pl.errors.length ? `<div class="warnline">${pl.failed} job${pl.failed===1?"":"s"} cannot be filled:<br>${pl.errors.slice(0,5).map(esc).join("<br>")}</div>` : ""}
      ${pl.total && !pl.new && !pl.failed ? `<div class="hint">Everything already generated. Tick "Regenerate existing images anyway" for new versions.</div>` : ""}`;
  }
  el.innerHTML = html;
  if(btn){ btn.disabled = !can || rnActive(); btn.textContent = rnActive() ? "Running …" : S.rnDry ? "Start dry run" : "Start generating"; }
}
function rnStatusRender(){
  const el = $("#rn-status"); if(!el) return;
  const st = RN.status || {state: "idle"};
  const labels = {idle: "Ready", running: "Running", stopping: "Stopping …", done: "Done", stopped: "Stopped", error: "Error"};
  const finished = (st.done||0) + (st.skipped||0) + (st.failed||0) + (st.idle||0);
  const pct = st.total ? Math.round(100 * finished / st.total) : 0;
  const active = rnActive();
  el.innerHTML = `<h2>Status <span class="rn-badge rn-${esc(st.state)}">${labels[st.state] || esc(st.state)}${st.dry_run?" · Dry run":""}</span></h2>
    ${st.state === "idle" ? `<p class="hint">No run yet since the gallery started. Runs from the terminal (<code>bench run</code>) do not show up here, but their images do in the gallery.</p>` : `
    <div class="rn-bar"><div style="width:${pct}%"></div></div>
    <div class="rn-nums"><span><b>${st.done||0}</b> ${st.dry_run?"filled":"generated"}</span><span><b>${st.skipped||0}</b> skipped</span><span class="${st.failed?"rn-errn":""}"><b>${st.failed||0}</b> errors</span><span>${finished}/${st.total||0}</span>
      ${active && st.eta != null ? `<span>about ${fmtDur(st.eta)} left</span>` : ""}</div>
    ${st.current ? `<div class="rn-cur"><span class="rn-spin"></span>${esc(st.current)}</div>` : ""}
    ${st.msg && st.state === "error" ? `<div class="su-msg err">${esc(st.msg)}</div>` : ""}
    ${active ? `<div class="row" style="margin:10px 0"><button data-rn-act="stop">Stop after the current image</button><button data-rn-act="kill" class="x" style="font-size:13px">Abort now</button></div>` : ""}
    ${(st.recent||[]).length ? `<div class="rn-h" style="margin-top:12px">Latest images</div><div class="rn-thumbs">${st.recent.map(r =>
      `<img src="${fileUrl(r.file)}" data-rn-img="${esc(r.id)}" title="${esc(mLabel(r.model))} · ${esc(r.prompt)}${Object.keys(r.variant||{}).length?" · "+esc(Object.entries(r.variant).map(([k,v])=>k+": "+v).join(", ")):""} · seed ${r.seed}" alt="">`).join("")}</div>` : ""}
    <div class="rn-h" style="margin-top:12px">Log <span class="hint">${esc((st.started||"").replace("T"," "))}${st.finished ? " – " + esc(st.finished.slice(11)) : ""}</span></div>
    <div class="rn-log">${(st.log||[]).slice().reverse().map(l => `<div class="l-${esc(l.level)}"><span>${esc(l.t)}</span> ${esc(l.msg)}</div>`).join("")}</div>`}`;
  const nav = $("#nav-run");
  if(nav) nav.textContent = active ? `Generate · ${finished}/${st.total||0}` : "Generate";
  rnPlanRender();
}
async function rnPoll(){
  clearTimeout(RN.timer);
  try { RN.status = await api("GET", "api/run/status"); } catch(e){ return; }
  const st = RN.status;
  if(S.view === "run") rnStatusRender();
  else { const nav = $("#nav-run"); if(nav){ const f = (st.done||0)+(st.skipped||0)+(st.failed||0)+(st.idle||0);
    nav.textContent = rnActive() ? `Generate · ${f}/${st.total||0}` : "Generate"; } }
  // Reload gallery data when new images arrive (throttled) or at the end of a run
  const doneNow = st.done || 0;
  if(doneNow !== RN.lastDone && !st.dry_run && (Date.now() - RN.lastReload > 5000 || !rnActive())){
    RN.lastDone = doneNow; RN.lastReload = Date.now();
    await reloadGalleryData();
    if(S.view === "grid" || S.view === "gallery") render();
    if(!rnActive() && S.view === "run") rnPlanSoon();
  }
  if(rnActive()) RN.timer = setTimeout(rnPoll, 1500);
}

document.addEventListener("change", e => {
  const el = e.target; if(!el.closest || !el.closest("#run")) return;
  if(el.dataset.rnModel){ const id = el.dataset.rnModel; S.rnModels = el.checked ? [...new Set([...S.rnModels, id])] : S.rnModels.filter(x => x !== id); }
  else if(el.dataset.rnPrompt){ const id = el.dataset.rnPrompt; S.rnPrompts = el.checked ? [...new Set([...S.rnPrompts, id])] : S.rnPrompts.filter(x => x !== id); }
  else if(el.dataset.rnCat){ const ids = rnPrompts().filter(p => (p.category || "uncategorized") === el.dataset.rnCat).map(p => p.id);
    S.rnPrompts = el.checked ? [...new Set([...S.rnPrompts, ...ids])] : S.rnPrompts.filter(x => !ids.includes(x)); }
  else if(el.dataset.rnOpt === "force") S.rnForce = el.checked;
  else if(el.dataset.rnOpt === "dry") S.rnDry = el.checked;
  else if(el.dataset.rnLoraMode) S.rnLoraMode = el.dataset.rnLoraMode;
  else if(el.dataset.rnLora !== undefined){ const n = el.dataset.rnLora;
    S.rnLoraSel = el.checked ? [...new Set([...S.rnLoraSel, n])] : S.rnLoraSel.filter(x => x !== n); }
  else if(el.dataset.rnLoraSweep !== undefined) S.rnLoraSweep = el.value;
  else if(el.dataset.rnSw !== undefined){ S.rnSweeps[+el.dataset.rnSw][el.dataset.f] = el.value; save(); return keepFocus(rnRender); }
  else if(el.dataset.rnSwopt !== undefined){ const sw = S.rnSweeps[+el.dataset.rnSwopt], o = el.dataset.o;
    const vals = splitVals(sw.vals).filter(x => x !== o); if(el.checked) vals.push(o); sw.vals = vals.join(", "); }
  else return;
  save(); keepFocus(rnRender);
}, true);
document.addEventListener("input", e => {
  const el = e.target; if(!el.closest || !el.closest("#run")) return;
  if(el.dataset.rnLoraStr !== undefined){ S.rnLoraStr[el.dataset.rnLoraStr] = el.value; save(); rnPlanSoon(); return; }
  if(el.dataset.rnSwq !== undefined){ RN.swq[el.dataset.rnSwq] = el.value; const q = el.value.trim().toLowerCase();
    el.closest(".rn-sweep").querySelectorAll("[data-rn-swopt]").forEach(c =>
      c.closest("label").style.display = !q || c.dataset.o.toLowerCase().includes(q) ? "" : "none");
    return; }
  if(el.dataset.rnSw === undefined) return;
  S.rnSweeps[+el.dataset.rnSw][el.dataset.f] = el.value; save(); rnPlanSoon();
}, true);
document.addEventListener("click", async e => {
  const img = e.target.closest("[data-rn-img]");
  if(img){ const id = img.dataset.rnImg; if(!byId.has(id)) await reloadGalleryData();
    if(byId.has(id)) openLb(id, (RN.status.recent||[]).map(r => r.id).filter(x => byId.has(x))); return; }
  const el = e.target.closest("[data-rn-act]"); if(!el) return;
  const act = el.dataset.rnAct;
  if(act === "m-all") S.rnModels = D.models.map(m => m.id);
  else if(act === "m-none") S.rnModels = [];
  else if(act === "p-all") S.rnPrompts = rnPrompts().map(p => p.id);
  else if(act === "p-none") S.rnPrompts = [];
  else if(act === "add-sweep") S.rnSweeps.push({name: "", vals: ""});
  else if(act === "del-sweep"){ S.rnSweeps.splice(+el.dataset.i, 1); RN.swq = {}; }
  else if(act === "sw-all" || act === "sw-none"){ const i = +el.dataset.i, sw = S.rnSweeps[i], q = (RN.swq[i] || "").trim().toLowerCase();
    const shown = rnSweepOptions(sw.name).map(e => e.o).filter(o => !o.includes(",") && (!q || o.toLowerCase().includes(q)));
    const cur = splitVals(sw.vals);
    sw.vals = (act === "sw-all" ? [...new Set([...cur, ...shown])] : cur.filter(x => !shown.includes(x))).join(", "); }
  else if(act === "start"){
    el.disabled = true;
    try { RN.status = await api("POST", "api/run/start", rnBody()); RN.lastDone = -1; rnStatusRender(); rnPoll(); }
    catch(err){ RN.planErr = err.message; rnPlanRender(); }
    return;
  }
  else if(act === "stop" || act === "kill"){
    if(act === "kill" && !await uiConfirm("The current image in ComfyUI is aborted and the run ends.", {title: "Abort run?", ok: "Abort run", danger: true})) return;
    try { RN.status = await api("POST", "api/run/stop", {hard: act === "kill"}); rnStatusRender(); rnPoll(); } catch(err){ toast(err.message); }
    return;
  }
  else return;
  save(); rnRender();
});

load();
</script>
