<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComfyBench</title>
<style>
:root{
  --bg:#f6f5f2;--panel:#fff;--text:#1d1d1b;--muted:#6d6a63;--line:#e3e0d9;
  --accent:#c2410c;--accent-bg:#fdeee5;--star:#e59e0b;--err:#b91c1c;--cell:280px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141413;--panel:#1e1e1c;--text:#ecebe6;--muted:#9b978e;--line:#33322e;
  --accent:#fb923c;--accent-bg:#3a2417;--star:#fbbf24;--err:#f87171;}}
:root[data-theme="dark"]{--bg:#141413;--panel:#1e1e1c;--text:#ecebe6;--muted:#9b978e;--line:#33322e;--accent:#fb923c;--accent-bg:#3a2417;--star:#fbbf24;--err:#f87171;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-size:16px;margin:0;font-weight:650}
nav{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
nav button{border:0;background:transparent;padding:4px 12px;border-radius:6px}
nav button.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
#status{color:var(--muted);font-size:12.5px;margin-left:auto}
.ctrl{display:none;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:10px}
.ctrl.on{display:flex}
label{color:var(--muted);font-size:13px}
select,button,input[type=search]{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
input[type=search]{width:180px}
button{cursor:pointer}
.models{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;cursor:pointer;user-select:none;font-size:13px;background:var(--panel)}
.chip.off{opacity:.4;text-decoration:line-through}
main{display:none}main.on{display:block}
.wrap{overflow-x:auto;padding:0 16px 40px}
/* The compare grid scrolls in its own box so its header row can stay pinned below the page header */
#view-grid .wrap{height:calc(100vh - var(--vhdr,140px));overflow:auto}
table{border-collapse:separate;border-spacing:0;margin-top:8px}
th,td{vertical-align:top;padding:8px}
tbody tr.first td{border-top:1px solid var(--line);padding-top:14px}
thead th{position:sticky;top:0;z-index:2;background:var(--bg);text-align:left;font-weight:600;white-space:nowrap}
thead th:first-child{left:0;z-index:3}
thead tr+tr th{top:var(--h1,35px)}
thead th .meta{display:block;color:var(--muted);font-weight:400;font-size:12px}
thead th.g1{text-align:left;border-left:1px solid var(--line);padding-left:10px}
thead th.g2{font-weight:500;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line)}
.mlink{color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted);cursor:pointer}
.mlink:hover{color:var(--accent);border-color:currentColor}
#modelbar{display:none;gap:12px;align-items:baseline;flex-wrap:wrap;padding:12px 16px 0}
#modelbar.on{display:flex}
#modelbar b{font-size:17px}
#modelbar .back{color:var(--accent);text-decoration:none;font-size:13px}
#modelbar .hint{max-width:60ch}
td.p{width:270px;min-width:220px;position:sticky;left:0;background:var(--bg);z-index:1}
.pid{font-weight:600}
.tag{display:inline-block;font-size:11px;color:var(--accent);border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:1px}
.lora{display:inline-block;font-size:11px;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:0 6px;margin-right:4px;white-space:nowrap}
.txt{color:var(--muted);font-size:12.5px;margin-top:4px;max-height:7.5em;overflow:auto;white-space:pre-wrap}
.check{font-size:12px;margin-top:6px}
.vars{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.var{font-size:12px;background:var(--accent-bg);border-radius:4px;padding:1px 6px}
.var b{font-weight:600;color:var(--accent)}
.inthumb{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:11px;color:var(--muted)}
.inthumb img{width:56px;height:56px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
td.c{min-width:var(--cell);width:var(--cell)}
td.c img,.card img{width:100%;border-radius:6px;display:block;cursor:zoom-in;background:var(--line)}
.missing{height:110px;border:1px dashed var(--line);border-radius:6px;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:6px}
.missing.err{color:var(--err);border-color:var(--err);cursor:help}
.below{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:var(--muted)}
.ver{background:var(--line);border-radius:4px;padding:0 4px;color:var(--text)}
.stars{white-space:nowrap}
.stars span{cursor:pointer;color:var(--line);font-size:16px}
.stars span.on{color:var(--star)}
.stars.ro span{cursor:default}
tfoot td{font-weight:600;border-top:1px solid var(--line)}
#gal{padding:12px 16px 40px;columns:var(--cell);column-gap:12px}
.card{break-inside:avoid;margin:0 0 14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px}
.card figcaption{font-size:12px;color:var(--muted);padding:6px 2px 2px}
.card figcaption b{color:var(--text);font-weight:600}
.empty{padding:40px 16px;color:var(--muted)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;z-index:20;color:#eee}
#lb.open{display:flex}
#lb .img{flex:1;display:grid;place-items:center;padding:16px;min-width:0;cursor:zoom-out}
#lb .img img{max-width:100%;max-height:calc(100vh - 32px);object-fit:contain}
#lb aside{width:360px;padding:16px;overflow:auto;background:#111;font-size:13px}
#lb aside h3{margin:0 0 6px;font-size:15px}
#lb pre{white-space:pre-wrap;font-size:12px;color:#bbb;background:#1b1b1b;padding:8px;border-radius:6px;margin:4px 0 12px}
#lb .sec{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
#lb button{background:#222;color:#eee;border-color:#444;font-size:12px;padding:2px 8px}
#lb button.on{border-color:#fb923c;color:#fb923c}
#lb textarea{width:100%;background:#1b1b1b;color:#eee;border:1px solid #333;border-radius:6px;padding:6px;font:inherit;resize:vertical}
#lb .stars span{font-size:22px;color:#444}#lb .stars span.on{color:#fbbf24}
#lb .var{background:#3a2417}#lb .var b{color:#fb923c}
#lb .inp{display:flex;gap:8px;align-items:center;margin:8px 0}
#lb .inp img{width:72px;border-radius:4px}
.muted{color:#888}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:6px 14px;border-radius:6px;font-size:13px;display:none;z-index:30}
@media (max-width:700px){#lb{flex-direction:column}#lb aside{width:auto;max-height:45vh}td.p{position:static}}

/* Delete buttons */
.del-btn,.del-btn-card{border:0;background:transparent;cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px;opacity:0;transition:opacity .2s}
.del-btn:hover,.del-btn-card:hover{opacity:1;background:var(--err);color:#fff}
.card:hover .del-btn-card{opacity:.7}
#lb aside .del-btn{opacity:.5}
#lb aside .del-btn:hover{opacity:1;background:var(--err);color:#fff}
/* ---------- Generate ---------- */
.rn{display:grid;grid-template-columns:minmax(320px,1fr) minmax(320px,1fr);gap:18px;padding:14px 16px 60px;align-items:start}
.rn-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.rn-card h2{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:10px}
.rn-sec{border-top:1px solid var(--line);padding:10px 0}
.rn-h{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px;margin-bottom:6px}
.rn-h button{font-size:12px;padding:1px 8px;margin-left:4px}
.rn-item{display:flex;gap:8px;align-items:flex-start;padding:3px 0;color:var(--text);font-size:13.5px;cursor:pointer}
.rn-item input{margin-top:3px}
.rn-item small{display:block;color:var(--muted);font-size:12px}
.rn-item.rn-p small{display:inline}
.rn-plist{max-height:340px;overflow:auto;padding-right:4px}
.rn-cat{margin-bottom:6px}
.rn-p{padding-left:22px}
.rn-sweep{margin-bottom:6px}
.rn-sweep input:not([type=checkbox]){font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.rn-lora-modes{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.rn-lora-modes .rn-item{padding:0}
.rn-lora{margin-bottom:6px}
.rn-lora input[type=text],.rn-lora select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.rn-lora input[type=text]:disabled{opacity:.5}
.rn-lora .hint{width:100%}
.rn-plan{border-top:1px solid var(--line);padding:12px 0 10px;font-size:13.5px}
.rn-start{width:100%;padding:8px;font-size:14px}
.rn-badge{font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--line)}
.rn-running,.rn-stopping{background:var(--accent-bg);color:var(--accent)}
.rn-done{background:#dcfce7;color:#166534}
.rn-error{background:#fde8e8;color:#991b1b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rn-done{background:#14301f;color:#86efac}:root:not([data-theme="light"]) .rn-error{background:#3b1414;color:#fca5a5}}
.rn-bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 8px}
.rn-bar div{height:100%;background:var(--accent);transition:width .4s}
.rn-nums{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.rn-nums b{color:var(--text)}
.rn-errn b{color:var(--err)}
.rn-cur{margin-top:8px;font-size:13px;display:flex;gap:8px;align-items:center}
.rn-spin{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:rnspin 1s linear infinite;flex:none}
@keyframes rnspin{to{transform:rotate(360deg)}}
.rn-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px}
.rn-thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:zoom-in;background:var(--line)}
.rn-log{max-height:300px;overflow:auto;font:12px/1.5 ui-monospace,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.rn-log span{color:var(--muted)}
.rn-log .l-err{color:var(--err)}
.rn-log .l-warn{color:var(--accent)}
@media (max-width:900px){.rn{grid-template-columns:1fr}}
/* ---------- Setup ---------- */
.su{display:grid;grid-template-columns:210px 1fr;gap:20px;padding:14px 16px 60px;align-items:start}
.su-nav{position:sticky;top:120px;display:flex;flex-direction:column;gap:4px}
.su-nav>button{text-align:left;border:0;background:transparent;padding:6px 10px;border-radius:6px}
.su-nav>button.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.su-bar{margin-top:14px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);display:flex;flex-direction:column;gap:6px;font-size:13px}
.su-bar .dirty{color:var(--accent);font-weight:600}
.btn-p{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-p:disabled{opacity:.45;cursor:default}
.su-msg{font-size:12.5px;padding:8px;border-radius:6px;white-space:pre-wrap}
.su-msg.err{background:#fde8e8;color:#991b1b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .su-msg.err{background:#3b1414;color:#fca5a5}}
.su-check div{font-size:12.5px;margin:4px 0}
.su-cols{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:start}
.su-list{display:flex;flex-direction:column;gap:2px;position:sticky;top:120px;max-height:calc(100vh - 140px);overflow:auto}
.su-list button{text-align:left;border:1px solid transparent;background:transparent;padding:5px 8px;border-radius:6px;font-size:13px}
.su-list button.on{background:var(--panel);border-color:var(--line);font-weight:600}
.su-list .grp{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 2px 8px}
.su-list small{display:block;color:var(--muted);font-weight:400}
.su-edit{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.su-edit h2{margin:0 0 12px;font-size:17px}
.su-edit h3{margin:22px 0 8px;font-size:14px;border-top:1px solid var(--line);padding-top:14px}
.su-grid{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;align-items:center}
.su-grid>label{text-align:right}
.su-edit input[type=text],.su-edit textarea,.su-edit select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:100%}
.su-edit textarea{resize:vertical;min-height:2.4em}
.su-edit input.short{width:120px}
.hint{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
table.kv{border-collapse:collapse;width:100%}
table.kv td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.kv td.k{width:170px;font-family:ui-monospace,monospace;font-size:12.5px;padding-top:9px}
.x{border:0;background:transparent;color:var(--muted);font-size:15px;padding:2px 6px}
.x:hover{color:var(--err)}
.mapsum{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.mapsum span{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--bg)}
.mapsum span b{color:var(--accent)}
.mapsum span.warn{border-color:var(--err);color:var(--err)}
.nodes{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.node{border-bottom:1px solid var(--line);padding:6px 10px}
.node .nh{font-size:12.5px;font-weight:600;margin-bottom:4px}
.node .nh small{color:var(--muted);font-weight:400}
.inp{display:grid;grid-template-columns:170px 1fr 170px;gap:8px;align-items:center;font-size:12.5px;padding:2px 0}
.inp .n{font-family:ui-monospace,monospace}
.inp .v{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inp.mapped .n{color:var(--accent);font-weight:600}
.inp select{padding:2px 6px!important}
.prev{font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:6px}
.prev div{margin:3px 0}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.warnline{color:var(--err);font-size:12.5px}
.su-vd{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:14px}
.su-vd-list,.rn-sw-list{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px 8px;margin:8px 0}
.rn-sw-list .rn-item small{display:inline;margin-left:6px}
/* ---------- Dialogs ---------- */
dialog.dlg{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);padding:0;width:min(420px,calc(100vw - 32px));box-shadow:0 16px 48px rgba(0,0,0,.28)}
dialog.dlg.wide{width:min(640px,calc(100vw - 32px))}
dialog.dlg::backdrop{background:rgba(0,0,0,.45)}
.dlg>form{padding:16px 18px}
.dlg h3{margin:0 0 8px;font-size:15px}
.dlg p{margin:0;white-space:pre-wrap}
.dlg-l{display:flex;flex-direction:column;gap:6px}
.dlg input[type=text],.dlg select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
.dlg input[type=text]:focus,.dlg select:focus{outline:2px solid var(--accent-bg);border-color:var(--accent)}
.dlg-err{color:var(--err);font-size:12.5px;min-height:1.3em;margin-top:6px}
.dlg-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.btn-d{background:var(--err);color:var(--panel);border-color:var(--err)}
@media (max-width:900px){.su,.su-cols{grid-template-columns:1fr}.su-nav,.su-list{position:static}.inp{grid-template-columns:1fr 1fr}.inp .v{display:none}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>ComfyBench</h1>
    <nav><button data-view="grid">Compare</button><button data-view="gallery">Gallery</button><button data-view="run" id="nav-run">Generate</button><button data-view="setup" id="nav-setup">Setup</button></nav>
    <button id="reload" title="Reload">↻</button>
    <span id="status"></span>
  </div>
  <div class="ctrl" id="ctrl-grid">
    <div><label>Columns </label><select id="axis"></select></div>
    <div><label>Sub-columns </label><select id="sub"></select></div>
    <div><label>Seed </label><select id="seed"></select></div>
    <div><label>Category </label><select id="cat"></select></div>
    <input type="search" id="q" placeholder="Prompt or variant…">
    <div class="models" id="chips"></div>
  </div>
  <div class="ctrl" id="ctrl-gallery">
    <div><label>Model </label><select id="gModel"></select></div>
    <div><label>Prompt </label><select id="gPrompt"></select></div>
    <div><label>Min. </label><select id="gMin"><option value="0">all</option><option value="1">★</option><option value="2">★★</option><option value="3">★★★</option><option value="4">★★★★</option><option value="5">★★★★★</option></select></div>
    <div><label>Sort </label><select id="gSort"><option value="new">newest</option><option value="best">best</option><option value="old">oldest</option></select></div>
    <input type="search" id="gq" placeholder="Text, variant, note…">
  </div>
  <div class="ctrl on" id="ctrl-size" style="margin-top:6px"><label>Size </label><input id="size" type="range" min="160" max="560" value="280"></div>
</header>
<main id="view-grid"><div id="modelbar"></div><div class="wrap"><table id="grid"></table></div></main>
<main id="view-gallery"><div id="gal"></div></main>
<main id="view-run"><div id="run"></div></main>
<main id="view-setup"><div id="setup"></div></main>
<div id="lb"><div class="img"><img alt=""></div><aside></aside></div>
<div id="toast"></div>
<script>
const EMBED = /*__DATA__*/null;
let D = null, STATIC = false;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls = {
  get(k){ try { return JSON.parse(localStorage.getItem("cb2:"+k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem("cb2:"+k, JSON.stringify(v)); } catch(e){} }
};
const S = Object.assign({view:"grid", axis:"model", sub:"none", seed:"", cat:"", q:"", size:280, hidden:[], gModel:"", gPrompt:"", gMin:"0", gSort:"new", gq:"", focus:"", mview:{}}, ls.get("state") || {});
const save = () => ls.set("state", S);
const fileUrl = r => (STATIC ? "" : "files/") + r.split("/").map(encodeURIComponent).join("/");
function toast(t){ const el=$("#toast"); el.textContent=t; el.style.display="block"; clearTimeout(toast.t); toast.t=setTimeout(()=>el.style.display="none",1800); }

// ---------------------------------------------------------- Dialogs
// In-app replacements for confirm()/prompt(). [data-close] buttons cancel, a backdrop click too.
function uiDialog(html, {wide = false} = {}){
  const d = document.createElement("dialog"); d.className = "dlg" + (wide ? " wide" : ""); d.innerHTML = html;
  let downOnBackdrop = false;  // ignore text-selection drags that end on the backdrop
  d.addEventListener("mousedown", e => downOnBackdrop = e.target === d);
  d.addEventListener("click", e => { if((e.target === d && downOnBackdrop) || e.target.closest("[data-close]")) d.close(); });
  d.addEventListener("close", () => d.remove());
  document.body.append(d); d.showModal(); return d;
}
function uiConfirm(msg, {title = "", ok = "OK", danger = false} = {}){
  return new Promise(res => {
    const d = uiDialog(`<form method="dialog">${title ? `<h3>${esc(title)}</h3>` : ""}<p>${esc(msg)}</p>
      <div class="dlg-btns"><button type="button" data-close>Cancel</button><button value="ok" class="${danger ? "btn-d" : "btn-p"}" autofocus>${esc(ok)}</button></div></form>`);
    d.addEventListener("close", () => res(d.returnValue === "ok"));
  });
}
// Resolves to the trimmed value, or null when cancelled. validate(v) returns an error message or "".
function uiPrompt(label, {value = "", placeholder = "", ok = "OK", validate} = {}){
  return new Promise(res => {
    const d = uiDialog(`<form method="dialog"><label class="dlg-l">${esc(label)}<input type="text" value="${esc(value)}" placeholder="${esc(placeholder)}" autocomplete="off" spellcheck="false"></label>
      <div class="dlg-err"></div><div class="dlg-btns"><button type="button" data-close>Cancel</button><button value="ok" class="btn-p">${esc(ok)}</button></div></form>`);
    const inp = d.querySelector("input"), err = d.querySelector(".dlg-err");
    inp.select(); inp.oninput = () => err.textContent = "";
    d.querySelector("form").addEventListener("submit", e => {
      const v = inp.value.trim(), msg = v ? (validate && validate(v)) || "" : "Please enter a value";
      if(msg){ e.preventDefault(); err.textContent = msg; inp.focus(); }
    });
    d.addEventListener("close", () => res(d.returnValue === "ok" ? inp.value.trim() : null));
  });
}
// Validator factory for names/IDs: pattern + human description + optional "taken" check
const nameRule = (re, what, taken) => v => !re.test(v) ? `${what} only` : taken && taken(v) ? `"${v}" already exists` : "";
const RE_NAME = /^\w+$/, RE_ID = /^[\w.-]+$/;

let byCell, byId, modelMap, promptMap, loraCombos = [];
const ck = (m,p,v,s) => [m,p,v,s].join("\u0001");
const ckL = (m,p,v,s,l) => ck(m,p,v,s) + "\u0002" + (l || "none");
const loraKey = g => g.lora_combo || "none";
const loraLabel = k => (!k || k === "none") ? "base" : k;
const loraBadge = g => { const k = loraKey(g); return k === "none" ? "" : `<span class="lora" title="LoRA combination">${esc(k)}</span>`; };
// Does this model define every LoRA of a combination key such as "style,detail:0.7"?
const modelUsesLora = (m, key) => key === "none"
  || key.split(",").map(x => x.split(":")[0].trim()).every(n => Object.keys(m.loras || {}).includes(n));
function index(){
  byCell = new Map(); byId = new Map();
  modelMap = new Map(D.models.map(m => [m.id, m]));
  promptMap = new Map(D.prompts.map(p => [p.id, p]));
  D.generations.forEach((g,i) => {
    g._i = i; byId.set(g.id, g);
    const k = ck(g.model, g.prompt, g.variant_key || "", g.seed);
    if(!byCell.has(k)) byCell.set(k, []);
    byCell.get(k).push(g);
    if(loraKey(g) !== "none"){
      const kl = ckL(g.model, g.prompt, g.variant_key || "", g.seed, loraKey(g));
      if(!byCell.has(kl)) byCell.set(kl, []);
      byCell.get(kl).push(g);
    }
  });
  for(const a of byCell.values()) a.sort((x,y) => y._i - x._i);
  loraCombos = [...new Set(D.generations.map(loraKey))].sort((a, b) =>
    (a === "none" ? -1 : b === "none" ? 1 : a.localeCompare(b)));
}
const versionsOf = g => (byCell.get(ck(g.model, g.prompt, g.variant_key || "", g.seed)) || []).filter(x => x.status === "ok");
const shortVal = v => String(v).split("/").pop().replace(/\.(safetensors|ckpt|pt|gguf|sft)$/i, "");
const dimLabel = n => n === "checkpoint" ? "Checkpoints" : "Variable: " + n;
const rating = id => (D.ratings[id] || {}).rating || 0;
const mLabel = id => modelMap.has(id) ? modelMap.get(id).label : (String(id).startsWith("import:") ? id.slice(7) + " · Import" : id);
const varChips = v => Object.entries(v || {}).map(([k,l]) => `<span class="var"><b>${esc(k)}</b> ${esc(l)}</span>`).join("");
function stars(id){
  const r = rating(id);
  return `<span class="stars ${STATIC?"ro":""}" data-id="${esc(id)}">${[1,2,3,4,5].map(i=>`<span class="${i<=r?"on":""}" data-r="${i}">★</span>`).join("")}</span>`;
}

async function load(){
  if(EMBED){ D = EMBED; STATIC = true; }
  else {
    try { const r = await fetch("api/data"); D = await r.json(); if(D.error) throw new Error(D.error); }
    catch(e){ document.body.insertAdjacentHTML("beforeend", `<p class="empty">Could not load data: ${esc(e.message)}</p>`); return; }
  }
  index(); S.focus = hashFocus(); if(S.focus) S.view = "grid"; fillControls(); render();
  if(!STATIC && !load.polled){ load.polled = true; rnPoll(); }
}

function opts(sel, items, cur){ sel.innerHTML = items.map(([v,l]) => `<option value="${esc(v)}" ${String(v)===String(cur)?"selected":""}>${esc(l)}</option>`).join(""); }

// ---------------------------------------------------------- Model detail view
// Focused model (detail page) stores its column settings apart from Compare.
const focusId = () => (S.focus && modelMap.has(S.focus)) ? S.focus : "";
function gridCfg(){
  const id = focusId();
  if(!id) return S;
  if(!S.mview[id]) S.mview[id] = {};
  return S.mview[id];
}
// Variant keys that only exist because of a sweep (present in images, absent from prompts.yaml)
function sweepVarsFor(mid){
  const out = [];
  for(const g of D.generations){
    if(g.status !== "ok" || (mid && g.model !== mid)) continue;
    const p = promptMap.get(g.prompt); if(!p) continue;
    const base = new Set();
    p.variants.forEach(v => { if(!v.extra) Object.keys(v.variant).forEach(k => base.add(k)); });
    Object.keys(g.variant || {}).forEach(k => { if(!base.has(k) && !out.includes(k)) out.push(k); });
  }
  return out;
}
function hashFocus(){
  const m = (location.hash || "").match(/^#model\/([^/]+)$/);
  if(!m) return "";
  let id = m[1];
  try { id = decodeURIComponent(id); } catch(e){}
  return modelMap.has(id) ? id : "";
}
function setFocus(id, keepHistory){
  S.focus = id && modelMap.has(id) ? id : "";
  save();
  const h = S.focus ? "#model/" + encodeURIComponent(S.focus) : "";
  if(!keepHistory && location.hash !== h){
    if(S.focus) history.pushState(null, "", h);
    else history.pushState(null, "", location.pathname + location.search);
  }
  if(S.view !== "grid" && S.view !== "setup" && S.view !== "run") S.view = "grid";
  fillControls(); render();
}
function renderModelBar(){
  const el = $("#modelbar"), id = focusId();
  if(!id){ el.classList.remove("on"); el.innerHTML = ""; return; }
  const m = modelMap.get(id);
  const n = D.generations.filter(g => g.status === "ok" && g.model === id && (g.files||[]).length).length;
  const sel = D.models.map(x => `<option value="${esc(x.id)}" ${x.id===id?"selected":""}>${esc(x.label)}</option>`).join("");
  el.classList.add("on");
  el.innerHTML = `<a class="back" href="#" data-focus="">← Compare</a>
    <b>${esc(m.label)}</b><select id="msel" title="Switch model" aria-label="Switch model">${sel}</select>
    <span class="hint">${n} image${n===1?"":"s"}${m.notes?" · "+esc(m.notes):""}</span>`;
}
function fillControls(){
  const cfg = gridCfg(), focus = focusId();
  const varNames = [...new Set(D.prompts.flatMap(p => p.variants.flatMap(v => Object.keys(v.variant))))];
  if(!D.seeds.map(String).includes(String(cfg.seed)) && cfg.seed !== "all") cfg.seed = String(D.seeds[0] ?? "");
  if(!cfg.axis) cfg.axis = focus ? "" : "model";
  if(cfg.axis.startsWith("var:") && !varNames.includes(cfg.axis.slice(4))) cfg.axis = "";
  if(cfg.axis === "lora" && !loraCombos.some(k => k !== "none")) cfg.axis = "";
  if(focus && (!cfg.axis || cfg.axis === "model")){
    const sw = sweepVarsFor(focus);
    cfg.axis = sw.includes("checkpoint") ? "var:checkpoint" : sw.length ? "var:" + sw[0]
      : (loraCombos.some(k => k !== "none") ? "lora" : "seed");
  }
  if(!focus && !cfg.axis) cfg.axis = "model";
  const axisOpts = focus
    ? [...varNames.map(n => ["var:"+n, dimLabel(n)]),
       ...(loraCombos.some(k => k !== "none") ? [["lora","LoRA"]] : []), ["seed","Seeds"]]
    : [["model","Models"], ["seed","Seeds"],
       ...(loraCombos.some(k => k !== "none") ? [["lora","LoRA"]] : []),
       ...varNames.map(n => ["var:"+n, dimLabel(n)])];
  // Every dimension is offered in both dropdowns; choosing the same one twice swaps them
  const subOpts = [["none","none"],
    ...(D.seeds.length > 1 ? [["seed","Seeds"]] : []),
    ...(loraCombos.some(k => k !== "none") ? [["lora","LoRA"]] : []),
    ...varNames.map(n => ["var:"+n, dimLabel(n)])];
  if(cfg.sub === cfg.axis) cfg.sub = "none";
  if(!cfg.sub || !subOpts.some(o => o[0] === cfg.sub)) cfg.sub = "none";
  opts($("#axis"), axisOpts, cfg.axis);
  opts($("#sub"), subOpts, cfg.sub);
  opts($("#seed"), [...D.seeds.map(s=>[s,s]), ["all","all side by side"]], cfg.seed);
  opts($("#cat"), [["","all"], ...[...new Set(D.prompts.map(p=>p.category).filter(Boolean))].map(c=>[c,c])], cfg.cat);
  const gm = [...new Set(D.generations.map(g=>g.model))];
  opts($("#gModel"), [["","all"], ...gm.map(m=>[m, mLabel(m)])], S.gModel);
  const gp = [...new Set(D.generations.map(g=>g.prompt))].sort();
  opts($("#gPrompt"), [["","all"], ...gp.map(p=>[p,p])], S.gPrompt);
  $("#gMin").value = S.gMin; $("#gSort").value = S.gSort; $("#q").value = cfg.q || ""; $("#gq").value = S.gq; $("#size").value = S.size;
  $("#chips").innerHTML = D.models.map(m => `<span class="chip ${S.hidden.includes(m.id)?"off":""}" data-id="${esc(m.id)}">${esc(m.label)}</span>`).join("");
  $("#chips").style.display = focus ? "none" : "";
}

// Size the compare grid's scroll box so its sticky header sits below the page header
function syncGridView(){
  const h = $("header").offsetHeight + ($("#modelbar").offsetHeight || 0);
  document.documentElement.style.setProperty("--vhdr", h + "px");
}
function render(){
  document.documentElement.style.setProperty("--cell", S.size + "px");
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.view === S.view));
  if(STATIC && (S.view === "setup" || S.view === "run")) S.view = "grid";
  $("#nav-setup").style.display = STATIC ? "none" : "";
  $("#nav-run").style.display = STATIC ? "none" : "";
  ["grid","gallery","run","setup"].forEach(v => { $("#view-"+v).classList.toggle("on", S.view===v); const c=$("#ctrl-"+v); if(c) c.classList.toggle("on", S.view===v); });
  $("#ctrl-size").classList.toggle("on", S.view !== "setup" && S.view !== "run");
  const ok = D.generations.filter(g => g.status === "ok").length;
  $("#status").textContent = `${ok} images · ${Object.keys(D.ratings).length} rated` + (STATIC ? " · static copy (read-only)" : "");
  if(S.view === "setup") return SU.data ? suRender() : suLoad();
  if(S.view === "run") return rnRender();
  if(S.view === "grid"){ renderModelBar(); renderGrid(); syncGridView(); } else renderGallery();
}

const keyOf = obj => Object.keys(obj).sort().map(k => k + "=" + obj[k]).join("|");
function cellHtml(m, p, vkey, s, sink, lora, seedNote){
  if(!m.modes.includes(p.mode)) return `<div class="missing">no ${esc(p.mode)} workflow</div>`;
  const all = byCell.get((lora === undefined || lora === "none")
    ? ck(m.id, p.id, vkey, s) : ckL(m.id, p.id, vkey, s, lora)) || [];
  const g = all.find(x => x.status === "ok");
  if(!g){
    const e = all[0];
    return e ? `<div class="missing err" title="${esc(e.error)}">Error · seed ${s}<br><small>${esc((e.error||"").slice(0,90))}</small></div>`
             : `<div class="missing">not generated yet · seed ${s}</div>`;
  }
  if(rating(g.id)) sink.ratings.push(rating(g.id));
  if(g.seconds) sink.secs.push(g.seconds);
  if(!sink.input && g.inputs && Object.keys(g.inputs).length) sink.input = g.inputs;
  const n = all.filter(x => x.status === "ok").length;
  const note = (D.ratings[g.id] || {}).note;
  return `<img loading="lazy" src="${fileUrl(g.files[0])}" data-id="${esc(g.id)}" alt="">
    <div class="below">${stars(g.id)}<span>${note?"📝 ":""}${loraBadge(g)}${n>1?`<span class="ver" title="${n} versions">v${n}</span> `:""}${g.seconds ?? "–"}s${seedNote?" · "+s:""}</span></div>`;
}

function renderGrid(){
  const focus = focusId(), focusModel = focus ? modelMap.get(focus) : null;
  const cfg = gridCfg();
  const models = D.models.filter(m => !S.hidden.includes(m.id) && (!focus || m.id === focus));
  const axis = cfg.axis || "model";
  const axVar = axis.startsWith("var:") ? axis.slice(4) : null;
  const sub = cfg.sub && cfg.sub !== axis ? cfg.sub : "none";
  const subVar = sub.startsWith("var:") ? sub.slice(4) : null;
  const seedsSel = cfg.seed === "all" ? D.seeds : [Number(cfg.seed)];
  const q = (cfg.q || "").trim().toLowerCase();

  // Columns
  let cols;
  if(axis === "model") cols = models.map(m => ({id: "m:"+m.id, label: m.label, meta: m.id, m}));
  else if(axis === "seed") cols = D.seeds.map(s => ({id: "s:"+s, label: "Seed " + s, s}));
  else if(axis === "lora") cols = loraCombos
    .filter(k => k === "none" || D.generations.some(g => loraKey(g) === k && !S.hidden.includes(g.model)))
    .map(k => ({id: "l:"+k, label: loraLabel(k), lora: k}));
  else {
    const labels = [];
    D.prompts.forEach(p => p.variants.forEach(v => {
      const l = v.variant[axVar]; if(l === undefined) return;
      if(focus && !D.generations.some(g => g.status === "ok" && g.model === focus && (g.variant||{})[axVar] === l)) return;
      if(!labels.includes(l)) labels.push(l);
    }));
    // Images that never got this value (not swept, or swept later) keep their own "default" column
    const hasDefault = D.generations.some(g => g.status === "ok" && g.mode !== "import" && (g.files||[]).length
      && !S.hidden.includes(g.model) && (!focus || g.model === focus) && (g.variant||{})[axVar] === undefined);
    if(hasDefault && labels.length) labels.push("\u0000default");   // un-swept images last
    cols = labels.map(l => l === "\u0000default"
      ? {id: "v:default", label: "default", dflt: true}
      : {id: "v:"+l, label: shortVal(axVar) + ": " + shortVal(l), full: axVar + ": " + l, l});
  }

  // Rows: Prompt × (variant without column/sub variable) × (model, when model is not the column)
  const consumed = [axVar, subVar].filter(Boolean);
  const rows = [];
  for(const p of D.prompts){
    if(cfg.cat && p.category !== cfg.cat) continue;
    if(focus && !focusModel.modes.includes(p.mode)) continue;   // no workflow for this model
    let groups = [];
    if(consumed.length){
      const seen = new Map();
      p.variants.forEach(v => {
        const rest = Object.fromEntries(Object.entries(v.variant).filter(([k]) => !consumed.includes(k)));
        const k = keyOf(rest);
        if(!seen.has(k)){ seen.set(k, {rest, label: Object.entries(rest).map(([a,b])=>a+": "+b).join(" · ")}); groups.push(seen.get(k)); }
      });
    } else groups = p.variants.map(v => ({rest: v.variant, label: v.label, key: v.key}));
    let first = true;
    for(const gr of groups){
      if(q && !(p.id+" "+gr.label+" "+p.prompt).toLowerCase().includes(q)) continue;
      const rowModels = (axis === "model" || focus) ? [null] : models;
      for(const m of rowModels){ rows.push({p, gr, m, first}); first = false; }
    }
  }
  if(!rows.length || !cols.length){
    $("#grid").innerHTML = `<tr><td class="empty">${focus ? `Nothing generated with ${esc(focusModel.label)} for this filter.` : axVar ? `No prompts with the variable "${esc(axVar)}" for this filter.` : "No prompts for this filter."}</td></tr>`;
    return;
  }

  // Sub-columns per main column: only values that actually have images for that column
  const rowModel = c => (axis === "model" ? c.m : null);
  const modelOf = (r, c) => rowModel(c) || r.m || models[0] || focusModel;
  // Sub-columns of a main column: the values that column has images for
  const subs = cols.map(c => {
    if(sub === "none") return [{}];
    if(sub === "seed") return D.seeds.map(s => ({s, label: "Seed " + s}));
    if(sub === "lora") return loraCombos.map(k => ({lora: k, label: loraLabel(k)}));
    const out = [], seen = new Set();
    let hasDefault = false;
    for(const g of D.generations){
      if(g.status !== "ok" || g.mode === "import" || !(g.files||[]).length) continue;
      if(axis === "model" ? g.model !== c.m.id : (focus && g.model !== focus)) continue;
      if(axis === "seed" && g.seed !== c.s) continue;
      if(axis === "lora" && loraKey(g) !== c.lora) continue;
      if(axVar && (g.variant||{})[axVar] !== c.l) continue;
      const v = (g.variant || {})[subVar];
      if(v === undefined){ hasDefault = true; continue; }
      if(!seen.has(v)){ seen.add(v); out.push(v); }
    }
    if(hasDefault) out.push("\u0000default");   // un-swept images last
    return out.map(v => v === "\u0000default" ? {val: "", label: "default"} : {val: v, label: shortVal(v), full: v});
  });

  const seedNote = cfg.seed === "all" && axis !== "seed" && sub !== "seed";
  // A main column without any sub column has nothing to show
  const keepIdx = cols.map((_, i) => i).filter(i => subs[i].length);
  if(keepIdx.length !== cols.length){
    const nc = keepIdx.map(i => cols[i]), ns = keepIdx.map(i => subs[i]);
    cols = nc; subs.splice(0, subs.length, ...ns);
  }
  if(!cols.length){ $("#grid").innerHTML = `<tr><td class="empty">No images for this sub-column.</td></tr>`; return; }
  const flatStats = cols.flatMap((c, ci) => subs[ci].map(() => ({ratings: [], secs: []})));
  const body = rows.map(({p, gr, m, first}) => {
    const sink = {ratings: [], secs: [], input: null};
    const cells = cols.map((c, ci) => {
      const model = modelOf({p, gr, m}, c);
      const vbase = {...gr.rest};
      if(axVar && !c.dflt) vbase[axVar] = c.l;
      const start = subs.slice(0, ci).reduce((n, x) => n + x.length, 0);
      return subs[ci].map((sv, si) => {
        const st = flatStats[start + si];
        if(!model) return `<td class="c"><div class="missing">–</div></td>`;
        const attribs = {...vbase};
        if(subVar && sv.val) attribs[subVar] = sv.val;
        const vkey = keyOf(attribs);
        if(!p.variants.some(v => v.key === vkey)) return `<td class="c"><div class="missing">not in set</div></td>`;
        if(axis === "lora" && !modelUsesLora(model, c.lora)) return `<td class="c"><div class="missing">LoRA not configured for this model</div></td>`;
        if(sub === "lora" && !modelUsesLora(model, sv.lora)) return `<td class="c"><div class="missing">LoRA not configured</div></td>`;
        const seeds = sub === "seed" ? [sv.s] : axis === "seed" ? [c.s] : seedsSel;
        const local = {ratings: [], secs: [], input: sink.input};
        const html = seeds.map(s => cellHtml(model, p, vkey, s, local,
          axis === "lora" ? c.lora : sub === "lora" ? sv.lora : undefined, seedNote)).join("<div style='height:10px'></div>");
        st.ratings.push(...local.ratings); st.secs.push(...local.secs);
        sink.input = local.input;
        return `<td class="c">${html}</td>`;
      }).join("");
    }).join("");
    const head = first ? `<div><span class="pid">${esc(p.id)}</span>${p.category?`<span class="tag">${esc(p.category)}</span>`:""}${p.mode!=="txt2img"&&p.mode!==p.category?`<span class="tag">${esc(p.mode)}</span>`:""}</div>
        <div class="txt">${esc(p.prompt)}</div>${p.check?`<div class="check">🔎 ${esc(p.check)}</div>`:""}` : "";
    const chips = (m && !focus ? `<span class="var"><b>Model</b> ${esc(m.label)}</span>` : "") + varChips(gr.rest);
    const inp = sink.input ? `<div class="inthumb">${Object.entries(sink.input).map(([k,f])=>`<img src="${fileUrl(f)}" alt="" title="${esc(k)}">`).join("")}<span>Input</span></div>` : "";
    return `<tr class="${first?"first":""}"><td class="p">${head}${chips?`<div class="vars">${chips}</div>`:""}${inp}</td>${cells}</tr>`;
  }).join("");
  const avg = a => a.reduce((x,y)=>x+y,0)/a.length;
  const colName = c => axis === "model"
    ? `<a class="mlink" href="#model/${encodeURIComponent(c.m.id)}" data-focus="${esc(c.m.id)}" title="Open ${esc(c.m.id)}">${esc(c.label)}</a>`
    : esc(c.label);
  // Header: one row, or model/sweep value on top and the sub-columns below
  let head1 = `<th rowspan="${sub==="none"?1:2}">Prompt</th>`, head2 = "";
  cols.forEach((c, ci) => {
    const start = cols.slice(0, ci).reduce((n, x, i) => n + subs[i].length, 0);
    const grp = flatStats.slice(start, start + subs[ci].length);
    const secs = grp.flatMap(st => st.secs);
    const meta = [axis === "model" ? c.m.id : "", secs.length ? avg(secs).toFixed(1)+"s Ø" : ""].filter(Boolean).join(" · ");
    if(sub === "none") head1 += `<th>${colName(c)}${meta?`<span class="meta">${esc(meta)}</span>`:""}</th>`;
    else {
      head1 += `<th class="g1" colspan="${subs[ci].length}">${colName(c)}${meta?`<span class="meta">${esc(meta)}</span>`:""}</th>`;
      head2 += subs[ci].map((sv, si) => {
        const st = flatStats[start + si];
        const m2 = st.secs.length ? avg(st.secs).toFixed(1)+"s" : "";
        return `<th class="g2" title="${esc(sv.full || sv.label)}">${esc(sv.label)}${m2?`<span class="meta">${esc(m2)}</span>`:""}</th>`;
      }).join("");
    }
  });
  const foot = flatStats.map(st => `<td>${st.ratings.length ? avg(st.ratings).toFixed(2)+` ★ <span style="font-weight:400;color:var(--muted)">(${st.ratings.length})</span>` : "–"}</td>`).join("");
  $("#grid").innerHTML = `<thead><tr>${head1}</tr>${head2?`<tr>${head2}</tr>`:""}</thead><tbody>${body}</tbody><tfoot><tr><td>Average rating (visible)</td>${foot}</tr></tfoot>`;
  const r1 = $("#grid").tHead && $("#grid").tHead.rows[0];
  if(sub !== "none" && r1) $("#grid").style.setProperty("--h1", r1.getBoundingClientRect().height + "px");
}

function renderGallery(){
  const q = S.gq.trim().toLowerCase(), min = Number(S.gMin);
  let gens = D.generations.filter(g => g.status === "ok" && g.files && g.files.length
    && (!S.gModel || g.model === S.gModel) && (!S.gPrompt || g.prompt === S.gPrompt)
    && rating(g.id) >= min

}

function parseScalar(t){
  const s = String(t).trim();
  if(s === "") return undefined;
  if(s === "true") return true;
  if(s === "false") return false;
  if(/^-?\d+$/.test(s)) return parseInt(s, 10);
  if(/^-?\d*\.\d+$/.test(s)) return parseFloat(s);
  return String(t).includes("\n") ? t : s;
}

  }
  const last = path[path.length - 1];
  if(v === undefined) delete o[last]; else o[last] = v;
}

// ---------------------------------------------------------------- Files
function pickFile(accept){
  return new Promise(res => { const i = document.createElement("input"); i.type = "file"; i.accept = accept;
    i.onchange = () => res(i.files[0] || null); i.click(); });
}
async function uploadWorkflow(){
  const f = await pickFile(".json,application/json"); if(!f) return null;
  let wf; try { wf = JSON.parse(await f.text()); } catch(e){ suErr("That is not a valid JSON file."); return null; }
  const send = overwrite => api("POST", "api/upload", {kind: "workflow", name: f.name, workflow: wf, overwrite});
  try {
    let r;
    try { r = await send(false); }
    catch(e){ if(/already exists/.test(e.message) && await uiConfirm(e.message, {title: "Overwrite file?", ok: "Overwrite"})) r = await send(true); else throw e; }
    SU.data.files.workflows = [...new Set([...SU.data.files.workflows, r.path])].sort();
    delete SU.analysis[r.path];
    return r.path;
  } catch(e){ suErr(e.message); return null; }
}
async function uploadInput(){
  const f = await pickFile("image/png,image/jpeg,image/webp"); if(!f) return null;
  const dataUrl = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); });
  const send = overwrite => api("POST", "api/upload", {kind: "input", name: f.name, data: dataUrl, overwrite});
  try {
    let r;
    try { r = await send(false); }
    catch(e){ if(/already exists/.test(e.message) && await uiConfirm(e.message, {title: "Overwrite file?", ok: "Overwrite"})) r = await send(true); else throw e; }
    SU.data.files.inputs = [...new Set([...SU.data.files.inputs, r.path])].sort();
    return r.path;
  } catch(e){ suErr(e.message); return null; }
}

// ---------------------------------------------------------------- Models
function specOf(m, mode){
  const raw = mode === "txt2img" ? (m.workflow || (m.workflows || {}).txt2img) : (m.workflows || {})[mode];
  if(!raw) return null;
  return typeof raw === "string" ? {file: raw, map: {}} : {file: raw.file || "", map: raw.map || {}};
}
function setSpec(m, mode, spec){
  const val = spec ? (Object.keys(spec.map || {}).length ? {file: spec.file, map: spec.map} : spec.file) : undefined;
  if(mode === "txt2img"){
    if(m.workflows) delete m.workflows.txt2img;
    if(val === undefined) delete m.workflow; else m.workflow = val;
  } else {
    m.workflows = m.workflows || {};
    if(val === undefined) delete m.workflows[mode]; else m.workflows[mode] = val;
  }
  if(m.workflows && !Object.keys(m.workflows).length) delete m.workflows;
}
function modesOf(m){
  const out = [];
  if(m.workflow || (m.workflows || {}).txt2img) out.push("txt2img");
  Object.keys(m.workflows || {}).forEach(k => { if(!out.includes(k)) out.push(k); });
  return out;
}
const asList = t => Array.isArray(t) ? t : (t ? [t] : []);
function hasValue(m, key){
  if((SU.data.builtin_keys || []).includes(key) || IMAGE_KEY.test(key)) return true;
  return key in (SU.cfg.defaults || {}) || key in (m.params || {});
}

function suMapping(id, m, mode, sp){
  const an = SU.analysis[sp.file];
  const keys = Object.keys(sp.map);
  const sum = keys.map(k => { const ok = hasValue(m, k);
    return `<span class="${ok?"":"warn"}" title="${ok?"":"No value: set as a parameter"}"><b>${esc(k)}</b> → ${asList(sp.map[k]).map(esc).join(", ")}${ok?"":" ⚠"}</span>`; }).join("");
  let body;
  if(!sp.file) body = `<p class="hint">Select a workflow file first.</p>`;
  else if(!an) body = `<p class="hint">Analyzing workflow …</p>`;
  else if(an.error) body = `<div class="su-msg err">${esc(an.error)}</div>`;
  else body = suNodes(m, sp, an);
  const missing = keys.filter(k => !hasValue(m, k));
  return `<h3>Mapping · ${esc(mode)} <span class="hint">${esc(sp.file)}</span></h3>
    <p class="hint" style="margin-top:0">Which field in the workflow gets which value? One value can go into several fields (e.g. seed in Sampler and LLM). A mapped field is overwritten during the run, even if there is a link.</p>
    <div class="mapsum">${sum || `<span>nothing mapped yet</span>`}</div>
    ${missing.length ? `<div class="warnline">No value: ${missing.map(esc).join(", ")}. <button data-act="fill-missing">Take values from workflow</button></div>` : ""}
    ${an && an.placeholders && an.placeholders.length ? `<p class="hint">The workflow already contains placeholders: ${an.placeholders.map(p=>`<code>{{${esc(p)}}}</code>`).join(" ")} – these keep working.</p>` : ""}
    ${an && !an.error && !an.has_output ? `<div class="warnline">No Save/Preview Image node found – the workflow will not deliver an image this way.</div>` : ""}
    <div class="row" style="margin:8px 0">
      <button data-act="apply-sugg" ${an && !an.error ? "" : "disabled"}>Apply suggestions</button>
      <button data-act="clear-map">Clear mapping</button>
      <input type="search" id="su-nodeq" placeholder="Search node or field…" value="${esc(SU.nodeQ)}" style="width:200px">
      <label><input type="checkbox" data-act="all-nodes" ${SU.allNodes?"checked":""}> include pure link nodes</label>
    </div>${body}`;
}
function suNodes(m, sp, an){
  const rev = {};
  Object.entries(sp.map).forEach(([k, t]) => asList(t).forEach(x => rev[x] = k));
  const sugg = {};
  Object.entries(an.suggest || {}).forEach(([k, t]) => t.forEach(x => sugg[x] = k));
  const custom = [...new Set([...Object.keys(sp.map), ...Object.keys(m.params || {})])].filter(k => !SU.data.standard_keys.includes(k));
  const options = cur => [`<option value="">—</option>`,
    ...[...SU.data.standard_keys, ...custom].map(k => `<option ${k===cur?"selected":""}>${esc(k)}</option>`),
    `<option value="__new">＋ custom name …</option>`].join("");
  const q = SU.nodeQ.trim().toLowerCase();
  const html = an.nodes.map(n => {
    const hay = (n.id + " " + n.class_type + " " + n.title + " " + n.inputs.map(i => i.name).join(" ")).toLowerCase();
    if(q && !hay.includes(q)) return "";
    const anyMapped = n.inputs.some(i => rev[`${n.id}/${i.name}`]);
    if(!SU.allNodes && !anyMapped && !n.inputs.some(i => !i.link)) return "";
    const rows = n.inputs.map(i => {
      const t = `${n.id}/${i.name}`, cur = rev[t] || "";
      const v = i.link ? `→ Node ${i.value[0]}` : (typeof i.value === "string" ? JSON.stringify(i.value) : String(i.value));
      const s = !cur && sugg[t] ? ` <span class="hint" title="Suggestion">· Suggestion: ${esc(sugg[t])}</span>` : "";
      return `<div class="inp ${cur?"mapped":""}"><span class="n">${esc(i.name)}</span><span class="v" title="${esc(v.slice(0, 600))}">${esc(v.slice(0, 140))}${s}</span>
        <select data-map="${esc(t)}">${options(cur)}</select></div>`;
    }).join("");
    return `<div class="node"><div class="nh">${esc(n.title || n.class_type)} <small>#${esc(n.id)} · ${esc(n.class_type)}</small></div>${rows}</div>`;
  }).join("");
  return `<div class="nodes">${html || `<p class="hint" style="padding:8px">No matching nodes.</p>`}</div>`;
}
async function suEnsureAnalysis(){
  const m = SU.cfg.models[SU.model]; if(!m) return;
  const sp = specOf(m, SU.mode); if(!sp || !sp.file || SU.analysis[sp.file]) return;
  const file = sp.file;
  try { SU.analysis[file] = await api("POST", "api/workflow/analyze", {file}); }
  catch(e){ SU.analysis[file] = {error: e.message}; }
  if(SU.sec === "models") suRender();
}
function applySuggestions(m, mode, onlyIfEmpty){
  const sp = specOf(m, mode); const an = SU.analysis[sp.file];
  if(!an || an.error) return false;
  if(onlyIfEmpty && Object.keys(sp.map).length) return false;
  const taken = new Set(Object.values(sp.map).flatMap(asList));
  for(const [k, targets] of Object.entries(an.suggest || {})){
    for(const t of targets){
      if(taken.has(t)) continue;
      sp.map[k] = [...asList(sp.map[k]), t]; taken.add(t);
    }
  }
  setSpec(m, mode, sp);
  fillFromWorkflow(m, mode, Object.keys(an.suggest || {}));
  return true;
}
function fillFromWorkflow(m, mode, keys){
  // Adopt values the model itself needs (sampler, steps, model negative …) as parameters
  const sp = specOf(m, mode); const an = SU.analysis[sp.file]; if(!an || an.error) return;
  const defaults = SU.cfg.defaults || {};
  const skip = new Set(["prompt", "seed", "width", "height", "image"]);
  const nodeVal = t => { const [nid, ...rest] = t.split("/"); const inp = rest.join("/");
    const n = an.nodes.find(x => x.id === nid); const i = n && n.inputs.find(x => x.name === inp);
    return i && !i.link ? i.value : undefined; };
  for(const k of keys){
    if(skip.has(k) || (m.params && k in m.params)) continue;
    const v = (an.values && k in an.values) ? an.values[k] : nodeVal(asList(sp.map[k])[0] || "");
    if(v === undefined || v === null || (typeof v === "string" && !v.trim())) continue;
    if(k in defaults && defaults[k] === v) continue;
    m.params = m.params || {}; m.params[k] = v;
  }
}

// ---------------------------------------------------------------- Prompts
function normVar(d){
  if(typeof d === "string" && d.startsWith("$")){ d = SU.doc.vars[d.slice(1)]; if(d === undefined) return null; }
  if(Array.isArray(d)) return d.map(v => [String(v), v]);
  if(d && typeof d === "object") return Object.entries(d);
  return [[String(d), d]];
}
function expandJS(p){
  const vars = p.vars || {}, names = Object.keys(vars);
  if(!names.length) return [{}];
  const opts = names.map(n => normVar(vars[n]));
  if(opts.some(o => !o || !o.length)) return null;
  let combos = [];
  const mode = p.vary || "product";
  if(mode === "zip"){ const L = opts[0].length; if(opts.some(o => o.length !== L)) return null; for(let i = 0; i < L; i++) combos.push(opts.map(o => o[i])); }
  else if(mode === "single"){ const base = opts.map(o => o[0]); combos.push(base); opts.forEach((o, i) => o.slice(1).forEach(a => { const c = base.slice(); c[i] = a; combos.push(c); })); }
  else { combos = [[]]; opts.forEach(o => { combos = combos.flatMap(c => o.map(a => [...c, a])); }); }
  return combos.map(c => Object.fromEntries(names.map((n, i) => [n, {label: c[i][0], value: c[i][1]}])));
}
const renderVarsJS = (t, v) => String(t || "").replace(/(?<!\{)\{(\w+)\}(?!\})/g, (m, n) => n in v ? String(v[n].value) : m);
function defnToText(d){
  if(Array.isArray(d)) return d.map(showScalar).join("\n");
  if(d && typeof d === "object") return Object.entries(d).map(([k, v]) => `${k}: ${v}`).join("\n");
  return showScalar(d);
}
function textToDefn(t){
  const lines = t.split("\n").map(l => l.trim()).filter(Boolean);
  if(!lines.length) return [];
  if(lines.every(l => LABEL_LINE.test(l))){ const o = {}; lines.forEach(l => { const x = l.match(LABEL_LINE); o[x[1].trim()] = x[2]; }); return o; }
  return lines.map(parseScalar);
}
function promptModeJS(p){
  if(p.mode) return p.mode;
  const keys = [...Object.keys(p), ...Object.keys(p.vars || {}), ...Object.keys(p.params || {})];
  return keys.some(k => IMAGE_KEY.test(k)) ? "img2img" : "txt2img";
}

function suPrompts(){
  const q = SU.pq.trim().toLowerCase();
  const groups = {};
  SU.doc.prompts.forEach(p => { if(q && !(p.id + " " + (p.category||"") + " " + p.prompt).toLowerCase().includes(q)) return;
    (groups[p.category || "uncategorized"] = groups[p.category || "uncategorized"] || []).push(p); });
  const list = Object.entries(groups).map(([c, ps]) => `<div class="grp">${esc(c)}</div>` + ps.map(p => {
    const n = (expandJS(p) || []).length;
    return `<button data-prompt="${esc(p.id)}" class="${SU.prompt===p.id?"on":""}">${esc(p.id)}${n>1?` <span class="hint">×${n}</span>`:""}</button>`; }).join("")).join("");
  const p = SU.doc.prompts.find(x => x.id === SU.prompt);
  return `<div class="su-cols"><div class="su-list"><input type="search" id="su-pq" placeholder="Search…" value="${esc(SU.pq)}" style="margin-bottom:6px">

function suPreview(p){
  const vs = expandJS(p);
  if(!vs) return `<span class="warnline">Variables incomplete (empty list, missing set, or lists of different lengths in zip).</span>`;
  const mode = promptModeJS(p);
  const models = Object.values(SU.cfg.models).filter(m => m.enabled !== false && modesOf(m).includes(mode)).length;
  const seeds = (p.seeds || SU.cfg.seeds || [42]).length;
  const used = new Set([...String(p.prompt || "").matchAll(/(?<!\{)\{(\w+)\}(?!\})/g)].map(x => x[1]));
  const undef = [...used].filter(n => !(n in (p.vars || {})));
  const notInText = Object.keys(p.vars || {}).filter(n => !used.has(n) && !String(p.negative || "").includes(`{${n}}`));
  return `<b>${vs.length} variant${vs.length===1?"":"s"}</b> × ${seeds} Seed${seeds===1?"":"s"} × ${models} model${models===1?"":"s"} (${esc(mode)}) = <b>${vs.length*seeds*models} images</b>
    ${undef.length ? `<div class="warnline">In the text but not defined: ${undef.map(n => `{${esc(n)}}`).join(", ")}</div>` : ""}
    ${notInText.length ? `<div class="hint">Not in the text: ${notInText.map(esc).join(", ")} – it only applies if a workflow value has that name.</div>` : ""}
    ${vs.slice(0, 4).map(v => `<div>${Object.keys(v).length ? varChips(Object.fromEntries(Object.entries(v).map(([k, x]) => [k, x.label]))) + "<br>" : ""}<span class="hint">${esc(renderVarsJS(p.prompt, v).slice(0, 260))}</span></div>`).join("")}
    ${vs.length > 4 ? `<div class="hint">… and ${vs.length - 4} more</div>` : ""}`;
}

async function saveCurrentAsTemplate(p){
  if(!p){ suErr("No prompt selected"); return; }
  const name = await uiPrompt("Template name", {value: p.id, placeholder: "e.g. My Portraits", ok: "Save template"});
  if(!name){ return; }
  const key = name.toLowerCase().replace(/[^\w]+/g, "-").replace(/^-|-$/g, "");
  const custom = loadTemplates();
  if(custom[key] && !await uiConfirm(`A custom template "${custom[key].name}" already exists.`, {title: "Replace template?", ok: "Replace"})) return;
  custom[key] = {
    name, category: p.category || "",
    prompt: p.prompt, negative: p.negative,
    vars: p.vars || {}, vary: p.vary || "product",
    width: p.width, height: p.height,
    check: p.check || "",
    params: p.params || {}, model_params: p.model_params || {}
  };

  toast(`Template "${name}" saved`);
}

// ---------------------------------------------------------------- Events
function suWhich(root){ return root === "cfg" ? "config" : "prompts"; }
function curPrompt(){ return SU.doc.prompts.find(x => x.id === SU.prompt); }
function curModel(){ return SU.cfg.models[SU.model]; }
function readBound(el){
  const t = el.dataset.t, raw = el.type === "checkbox" ? el.checked : el.value;
  if(t === "scalar") return parseScalar(raw);
  if(t === "seeds"){ const xs = String(raw).split(/[,\s]+/).filter(Boolean).map(x => parseInt(x, 10)).filter(x => !isNaN(x)); return xs.length ? xs : undefined; }
  if(t === "keep") return raw;
  return raw === "" ? undefined : raw;
}
document.addEventListener("input", e => {
  const el = e.target; if(!el.closest || !el.closest("#setup")) return;
  if(el.dataset.b){
    setAt(rootOf(el.dataset.root), JSON.parse(el.dataset.b), readBound(el));
    markDirty(suWhich(el.dataset.root));
    if(el.dataset.prev && $("#su-prev")) $("#su-prev").innerHTML = suPreview(curPrompt());
    return;
  }
  if(el.dataset.varvals !== undefined){
    const p = curPrompt(); p.vars[el.dataset.varvals] = textToDefn(el.value); markDirty("prompts");
    $("#su-prev").innerHTML = suPreview(p); return;
  }
  if(el.dataset.setvals !== undefined){ SU.doc.vars[el.dataset.setvals] = textToDefn(el.value); markDirty("prompts"); return; }
  if(el.id === "su-vdq" && SU.varDlg){ SU.varDlg.q = el.value; const pos = el.selectionStart; suRender(); const n = $("#su-vdq"); n.focus(); n.setSelectionRange(pos, pos); return; }
  if(el.id === "su-nodeq"){ SU.nodeQ = el.value; const pos = el.selectionStart; suRender(); const n = $("#su-nodeq"); n.focus(); n.setSelectionRange(pos, pos); return; }
  if(el.id === "su-pq"){ SU.pq = el.value; const pos = el.selectionStart; suRender(); const n = $("#su-pq"); n.focus(); n.setSelectionRange(pos, pos); }
}, true);

const renameKey = (obj, from, to) => Object.fromEntries(Object.entries(obj).map(([k, v]) => [k === from ? to : k, v]));
document.addEventListener("change", async e => {
  const el = e.target; if(!el.closest || !el.closest("#setup")) return;
  if(el.dataset.b && el.dataset.r){ keepFocus(suRender); return; }
  if(el.dataset.vdFile !== undefined && SU.varDlg){ const f = el.dataset.vdFile, d = SU.varDlg;
    d.sel = el.checked ? [...new Set([...d.sel, f])] : d.sel.filter(x => x !== f); keepFocus(suRender); return; }
  if(el.dataset.vdKey !== undefined && SU.varDlg){ SU.varDlg.key = el.value; SU.varDlg.sel = []; keepFocus(suRender); return; }
  const m = curModel(), p = curPrompt();
  if(el.dataset.wf !== undefined){
    const mode = el.dataset.wf; let file = el.value;
    if(file === "__upload"){ file = await uploadWorkflow(); if(!file){ keepFocus(suRender); return; } }
    const sp = specOf(m, mode) || {file: "", map: {}};
    sp.file = file; setSpec(m, mode, sp); SU.mode = mode; markDirty("config"); keepFocus(suRender);
    if(file){ await suEnsureAnalysis(); const an = SU.analysis[file];
      if(an && !an.error && !(an.placeholders || []).length && applySuggestions(m, mode, true)){ markDirty("config"); SU.info = "Mapping suggestions applied – please check briefly."; keepFocus(suRender); } }
    return;
  }
  if(el.dataset.map !== undefined){
    const t = el.dataset.map; let key = el.value;
    if(key === "__new"){ key = await uiPrompt("New value name", {placeholder: "e.g. steps", ok: "Add", validate: nameRule(RE_NAME, "Letters, digits and _")});
      if(!key){ keepFocus(suRender); return; } }
    const sp = specOf(m, SU.mode);
    for(const k of Object.keys(sp.map)){ const l = asList(sp.map[k]).filter(x => x !== t); if(l.length) sp.map[k] = l; else delete sp.map[k]; }
    if(key) sp.map[key] = [...asList(sp.map[key]), t];
    setSpec(m, SU.mode, sp); markDirty("config"); keepFocus(suRender); return;
  }
  if(el.dataset.actChange === "rename-prompt"){
    const nid = el.value.trim();
    if(!/^[\w.-]+$/.test(nid)){ suErr("ID: letters, digits, - _ . only"); el.value = p.id; return; }
    if(nid === p.id) return;
    if(SU.doc.prompts.some(x => x.id === nid)){ suErr(`ID ${nid} already exists`); el.value = p.id; return; }
    p.id = nid; SU.prompt = nid; markDirty("prompts"); keepFocus(suRender); return;
  }
  if(el.dataset.actChange === "neg-mode"){ if(el.value === "own") p.negative = p.negative ?? ""; else delete p.negative; markDirty("prompts"); keepFocus(suRender); return; }
  if(el.dataset.actChange === "prompt-image"){
    let f = el.value; if(f === "__upload"){ f = await uploadInput(); if(!f){ keepFocus(suRender); return; } }
    if(f) p.image = f; else delete p.image; markDirty("prompts"); keepFocus(suRender); return;
  }
  if(el.dataset.varname !== undefined){
    const from = el.dataset.varname, to = el.value.trim();
    if(!p.vars || !(from in p.vars) || to === from) return;
    if(!/^\w+$/.test(to) || (to !== from && to in p.vars)){ suErr("Variable name: letters, digits, _ only – and unique"); el.value = from; return; }
    p.vars = renameKey(p.vars, from, to); markDirty("prompts"); keepFocus(suRender); return;
  }
  if(el.dataset.varsrc !== undefined){ p.vars[el.dataset.varsrc] = el.value || []; markDirty("prompts"); keepFocus(suRender); return; }
  if(el.dataset.setname !== undefined){
    const from = el.dataset.setname, to = el.value.trim();
    if(!(from in SU.doc.vars) || to === from) return;
    if(!/^\w+$/.test(to) || (to !== from && to in SU.doc.vars)){ suErr("Set name: letters, digits, _ only – and unique"); el.value = from; return; }
    SU.doc.vars = renameKey(SU.doc.vars, from, to);
    SU.doc.prompts.forEach(x => Object.keys(x.vars || {}).forEach(k => { if(x.vars[k] === "$" + from) x.vars[k] = "$" + to; }));
    markDirty("prompts"); keepFocus(suRender);
  }
}, true);

document.addEventListener("click", async e => {
  const el = e.target.closest("#setup [data-sec], #setup [data-act], #setup [data-model], #setup [data-prompt]"); if(!el) return;
  if(el.dataset.sec){ SU.sec = el.dataset.sec; S.suSec = SU.sec; save(); SU.error = ""; suRender(); return; }
  if(el.dataset.model){ SU.model = el.dataset.model; SU.mode = "txt2img"; suRender(); return; }
  if(el.dataset.prompt){ SU.prompt = el.dataset.prompt; suRender(); return; }
  const act = el.dataset.act, m = curModel(), p = curPrompt();
  switch(act){
    case "save": return suSave();
    case "check": return suRunCheck(false);
    case "discard": if(await uiConfirm("All unsaved changes to config and prompts are lost.", {title: "Discard changes?", ok: "Discard", danger: true})) await suLoad(); return;
    case "add-model": {
      const id = await uiPrompt("Model ID", {placeholder: "e.g. flux-dev", ok: "Add model", validate: nameRule(RE_ID, "Letters, digits, - _ .", v => SU.cfg.models[v])}); if(!id) return;
      SU.cfg.models[id] = {label: id, params: {}}; SU.model = id; SU.mode = "txt2img"; markDirty("config"); return suRender();
    }
    case "del-model": if(await uiConfirm("It is removed from the config. Generated images stay in the gallery.", {title: `Delete model ${SU.model}?`, ok: "Delete model", danger: true})){ delete SU.cfg.models[SU.model]; SU.model = Object.keys(SU.cfg.models)[0] || null; markDirty("config"); suRender(); } return;
    case "toggle-enabled": if(el.checked) delete m.enabled; else m.enabled = false; markDirty("config"); return suRender();
    case "co-refresh": await loadComfyOptions(true); toast(CO.data.ok ? "Lists reloaded from ComfyUI" : CO.data.error); return suRender();
    case "lora-add": {
      const n = await uiPrompt("Short name of the LoRA", {placeholder: "e.g. style, detail", ok: "Add LoRA", validate: nameRule(RE_NAME, "Letters, digits and _", v => m.loras && m.loras[v])}); if(!n) return;
      m.loras = m.loras || {};
      m.loras[n] = {name: "", default_strength: 0.8}; markDirty("config"); return suRender();
    }
    case "lora-del": delete m.loras[el.dataset.lora]; if(!Object.keys(m.loras).length) delete m.loras; markDirty("config"); return suRender();
    case "var-files": {
      const keys = Object.keys((CO.data && CO.data.ok && CO.data.models[SU.model]) || {});
      const pref = ["checkpoint", "ckpt_name", "unet", "unet_name", "model"].find(k => keys.includes(k));
      SU.varDlg = {model: SU.model, key: pref || keys[0], sel: [], q: ""}; return suRender();
    }
    case "vd-close": SU.varDlg = null; return suRender();
    case "vd-all": case "vd-none": { const d = SU.varDlg, q = d.q.trim().toLowerCase();
      const shown = (comfyOpts(d.model, d.key) || []).filter(o => !q || o.toLowerCase().includes(q));
      d.sel = act === "vd-all" ? [...new Set([...d.sel, ...shown])] : d.sel.filter(x => !shown.includes(x)); return suRender(); }
    case "vd-create": {
      const d = SU.varDlg, stem = f => f.split(/[\\/]/).pop().replace(/\.[^.]+$/, "");
      const made = [];
      for(const f of d.sel){
        const base = stem(f).toLowerCase().replace(/[^a-z0-9.]+/g, "-").replace(/^[-.]+|[-.]+$/g, "") || "model";
        let nid = base, n = 2; while(SU.cfg.models[nid]) nid = `${base}-${n++}`;
        const c = clone(m); c.label = stem(f); c.params = {...(c.params || {}), [d.key]: f};
        SU.cfg.models[nid] = c; made.push(nid);
      }
      SU.varDlg = null; markDirty("config"); toast(`${made.length} model${made.length===1?"":"s"} created – save to keep`);
      return suRender();
    }
    case "add-mode": {
      const mode = await uiPrompt("Mode", {value: "img2img", placeholder: "e.g. img2img, inpaint", ok: "Add mode", validate: nameRule(RE_NAME, "Letters, digits and _")}); if(!mode) return;
      if(!specOf(m, mode)){ if(mode === "txt2img") m.workflow = {file: "", map: {}}; else { m.workflows = m.workflows || {}; m.workflows[mode] = {file: "", map: {}}; } }
      SU.mode = mode; markDirty("config"); return suRender();
    }
    case "del-mode": if(await uiConfirm("Its workflow and input mapping are removed from this model.", {title: `Remove mode ${el.dataset.mode}?`, ok: "Remove", danger: true})){ setSpec(m, el.dataset.mode, null); markDirty("config"); suRender(); } return;
    case "map-mode": SU.mode = el.dataset.mode; suRender(); return;
    case "apply-sugg": applySuggestions(m, SU.mode, false); markDirty("config"); SU.info = "Suggestions applied."; return suRender();
    case "clear-map": if(await uiConfirm(`All input mappings for ${SU.mode} are removed.`, {title: "Clear mapping?", ok: "Clear", danger: true})){ const sp = specOf(m, SU.mode); sp.map = {}; setSpec(m, SU.mode, sp); markDirty("config"); suRender(); } return;
    case "fill-missing": { const sp = specOf(m, SU.mode); fillFromWorkflow(m, SU.mode, Object.keys(sp.map).filter(k => !hasValue(m, k))); markDirty("config"); return suRender(); }
    case "all-nodes": SU.allNodes = el.checked; return suRender();
    case "kv-add": {
      const path = JSON.parse(el.dataset.path), root = rootOf(el.dataset.root);
      const k = await uiPrompt("Parameter name", {placeholder: "e.g. steps, cfg, sampler", ok: "Add", validate: nameRule(RE_NAME, "Letters, digits and _")}); if(!k) return;
      if(getAt(root, [...path, k]) === undefined) setAt(root, [...path, k], "");
      markDirty(suWhich(el.dataset.root)); return suRender();
    }
    case "kv-del": { const path = JSON.parse(el.dataset.path); setAt(rootOf(el.dataset.root), path, undefined);
      const parent = getAt(rootOf(el.dataset.root), path.slice(0, -1));
      if(parent && !Object.keys(parent).length) setAt(rootOf(el.dataset.root), path.slice(0, -1), undefined);
      markDirty(suWhich(el.dataset.root)); return suRender(); }
    case "add-prompt": {
      const id = await uiPrompt("ID of the new prompt", {placeholder: "e.g. hands-piano", ok: "Add prompt", validate: nameRule(RE_ID, "Letters, digits, - _ .", v => SU.doc.prompts.some(x => x.id === v))}); if(!id) return;
      SU.doc.prompts.push({id, category: p ? p.category : "", prompt: ""}); SU.prompt = id; markDirty("prompts"); return suRender();
    }
    case "add-prompt-tmpl": return showTemplateModal();
    case "save-as-tmpl": return saveCurrentAsTemplate(p);
    case "manage-tmpl": return showTemplateManager();
    case "dup-prompt": {
      let id = p.id + "-copy", n = 2; while(SU.doc.prompts.some(x => x.id === id)) id = `${p.id}-copy${n++}`;
      const c = clone(p); c.id = id; SU.doc.prompts.splice(SU.doc.prompts.indexOf(p) + 1, 0, c); SU.prompt = id; markDirty("prompts"); return suRender();
    }
    case "del-prompt": if(await uiConfirm("Generated images stay in the gallery.", {title: `Delete prompt ${p.id}?`, ok: "Delete prompt", danger: true})){ const i = SU.doc.prompts.indexOf(p); SU.doc.prompts.splice(i, 1); SU.prompt = (SU.doc.prompts[i] || SU.doc.prompts[i-1] || {}).id; markDirty("prompts"); suRender(); } return;
    case "add-var": { p.vars = p.vars || {}; let n = "var", k = 2; while(n in p.vars) n = "var" + k++; p.vars[n] = []; markDirty("prompts"); return suRender(); }
    case "del-var": delete p.vars[el.dataset.var]; if(!Object.keys(p.vars).length){ delete p.vars; delete p.vary; } markDirty("prompts"); return suRender();
    case "add-set": { let n = "set", k = 2; while(n in SU.doc.vars) n = "set" + k++; SU.doc.vars[n] = []; markDirty("prompts"); return suRender(); }
    case "del-set": { const n = el.dataset.set; const users = SU.doc.prompts.filter(x => Object.values(x.vars || {}).includes("$" + n));
      if(users.length) return suErr(`Set ${n} is still used by: ${users.map(x => x.id).join(", ")}`);
      delete SU.doc.vars[n]; markDirty("prompts"); return suRender(); }
  }
});
